<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MANO Web Rádio</title>
<style>
body{margin:0;background:#0d6efd;text-align:center;color:white;font-family:Arial;padding:0}
.topo{background:red;padding:6px 15px;border-radius:20px;display:inline-block;margin:15px auto;font-weight:bold}
.logo{width:260px;max-width:85%;margin:10px auto;display:block;border-radius:25px}
.player{background:white;color:black;width:88%;max-width:360px;margin:15px auto;border-radius:25px;padding:20px}
.play{width:90px;height:90px;background:#00bfff;border-radius:50%;border:none;font-size:40px;color:white;margin:10px auto;display:flex;align-items:center;justify-content:center;cursor:pointer}
.botoes{width:88%;max-width:360px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.botoes a{padding:14px;border-radius:25px;text-decoration:none;color:white;font-weight:bold;font-size:14px;display:block}
.wpp{background:#25D366} .chat{background:#fff;color:#000!important} .face{background:#00c6ff} .insta{background:#ff7eb3} .yt{background:#ff3b30} .tt{background:#000}
</style>
</head>
<body>
<div class="topo">🔴 AO VIVO DIRETO DE BLUMENAU</div>
<img src="logo.png" class="logo">
<div class="player">
<h3 style="margin:5px">MANO SHOW</h3>
<button class="play" onclick="document.getElementById('a').play()">▶️</button>
<p>Toque para ouvir</p>
<audio id="a" controls style="width:100%">
<source src="https://stream-175.zeno.fm/0ctt516rnhovv" type="audio/mpeg">
</audio>
</div>
<div class="botoes">
<a class="wpp" href="#">WHATSAPP</a>
<a class="chat" href="#">CHAT AO VIVO</a>
<a class="face" href="#">FACEBOOK</a>
<a class="insta" href="#">INSTAGRAM</a>
<a class="yt" href="#">YOUTUBE</a>
<a class="tt" href="#">TIKTOK</a>
</div>
</body>
</html>
