<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WEB RADIO MANO SHOW - AO VIVO BLUMENAU SC</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  background: radial-gradient(circle at top, #0a1a8a 0%, #0a7bdf 45%, #00bfff 100%);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  display:flex; justify-content:center; min-height:100vh; color:white;
}
.app{width:100%;max-width:400px;padding:25px 20px;text-align:center}
.badge{
  background:#ff1e2d;padding:8px 20px;border-radius:30px;font-weight:800;font-size:13px;
  display:inline-flex;align-items:center;gap:6px;box-shadow:0 0 20px rgba(255,30,45,.7);
}
.badge::before{content:'';width:9px;height:9px;background:white;border-radius:50%;display:inline-block;animation:pisca 1s infinite}
@keyframes pisca{0%,100%{opacity:1}50%{opacity:.3}}
/* SEM BORDA BRANCA AQUI */
.logo-wrap{
  margin:35px auto;
  border-radius:26px;
  overflow:hidden;
  border:none;
  box-shadow: 0 0 35px rgba(0,180,255,0.9), 0 0 70px rgba(0,120,255,0.4);
}
.logo-wrap img{width:100%;display:block}
h1{font-size:22px;font-weight:900;margin:25px 0}
.play{
  width:125px;height:125px;background:white;border-radius:50%;margin:0 auto;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  box-shadow:0 0 30px rgba(255,255,255,.8), 0 0 60px rgba(0,180,255,.7);
}
.status{margin-top:20px;font-size:13px;opacity:.9}
.footer{
  background:white;border-radius:26px;display:flex;justify-content:space-around;
  padding:16px 10px;margin-top:35px;
}
.footer a{text-decoration:none;color:#1a5fb4;font-size:11px;font-weight:700;text-align:center}
</style>
</head>
<body>
<div class="app">
  <div class="badge">● AO VIVO • BLUMENAU SC</div>

  <div class="logo-wrap">
    <img src="logo.png" alt="Mano Show">
  </div>

  <h1>WEB RADIO MANO SHOW</h1>
  <p style="font-size:13px;opacity:0.9;margin-top:-15px;margin-bottom:20px;">A rádio que toca com você 24h</p>

  <div class="play" onclick="toggle()">
    <svg width="50" height="50" viewBox="0 0 24 24" fill="#0090ff"><path d="M8 5.14v14l11-7-11-7z"/></svg>
  </div>

  <div class="status" id="st">Tocando agora • Ao vivo 24h</div>

  <audio id="radio" preload="none">
    <source src="https://stream-175.zeno.fm/0ctt51rnnhvv" type="audio/mpeg">
  </audio>

  <div style="margin-top:30px;">
    <a href="https://www.radios.com.br/aovivo/radio-mano-show/286882" target="_blank">
      <img src="https://www.radios.com.br/imagens/banners/120x60.gif" alt="Ouça na RadiosNet" style="border:0;border-radius:10px;">
    </a>
  </div>

  <div class="footer">
    <a href="https://wa.me/5547999999999" target="_blank">📱<br>WhatsApp</a>
    <a href="https://instagram.com" target="_blank">📸<br>Instagram</a>
    <a href="https://mano-240.github.io/radio" target="_blank">🌐<br>Site</a>
  </div>
</div>

<script>
let ok=false;
function toggle(){
  const a=document.getElementById('radio');
  const s=document.getElementById('st');
  if(!ok){a.play();s.innerHTML="🔴 AO VIVO TOCANDO";ok=true}
  else{a.pause();s.innerHTML="Tocando agora • Ao vivo 24h";ok=false}
}
</script>
</body>
</html>
