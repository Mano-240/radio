<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MANO Web Rádio</title>
<style>
body{margin:0;background:#00c8ff;text-align:center;color:white;font-family:Arial}
.topo{background:red;padding:7px 18px;border-radius:20px;display:inline-block;margin:15px auto;font-weight:bold}
.logo{width:260px;max-width:85%;margin:10px auto;display:block}
.player{background:white;color:#333;width:88%;max-width:350px;margin:15px auto;border-radius:30px;padding:25px}
.play{width:90px;height:90px;background:#00bfff;border-radius:50%;border:none;font-size:35px;color:white;margin:10px auto;display:flex;align-items:center;justify-content:center}
.botoes{width:88%;max-width:350px;margin:15px auto;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.botoes a{padding:14px;border-radius:25px;text-decoration:none;color:white;font-weight:bold;font-size:13px}
.wpp{background:#25D366} .chat{background:#fff;color:#000!important} .face{background:#00e0ff} .insta{background:#ff8fab} .yt{background:#ff4444} .tt{background:#000}
#meuAudio{display:none}
</style>
</head>
<body>
<div class="topo">🔴 AO VIVO DIRETO DE BLUMENAU</div>
<img src="logo.png" class="logo" style="border-radius:30px">
<div class="player">
<h3>MANO SHOW</h3>
<button class="play" onclick="document.getElementById('meuAudio').play()">▶</button>
<p>Toque para ouvir</p>
<audio id="meuAudio">
<source src="https://stream-175.zeno.fm/0ctt516rnhovv" type="audio/mpeg">
</audio>
</div>
<div class="botoes">
<a class="wpp" href="#">WHATSAPP</a>
<a class="chat" href="#">CHAT AO VIVO</a>
<a class="face" href="#">FACEBOOK</a>
<a class="insta" href="#">INSTAGRAM</a>
<a class="yt" href="#">YOUTUBE</a>
<a class="tt" href="#">TIKTOK</a>
</div>
</body>
</html>
